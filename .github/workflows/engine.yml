name: Engine

# Real-engine gate: bootstraps the latest PobTools-zh + PoB master and runs the full test gate
# (plus the frozen pob.exe on Windows) against it. Kept out of PR CI because it depends on moving
# upstreams and the network; runs nightly (engine-nightly.yml), on demand, before every release,
# and on PRs that change this workflow (a new workflow cannot be dispatched before it is on main).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/engine.yml"]

permissions:
  contents: read

# uv installs packages only; the interpreter is always the official CPython from setup-python.
env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  windows:
    name: Engine (Windows, native LuaJIT _lua-host)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          # No cache: this workflow gates releases, so PR/branch caches must not feed it.
          enable-cache: false

      - name: Install package and dev tools from the lockfile
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Build standalone Windows x64 binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean pob_cli/packaging/pob.spec

      - name: Bootstrap live slim PoB engine
        env:
          POB_RUNTIME_DIR: ${{ runner.temp }}/pob-win-rt
          POB_LEGACY_DIR: ""
        run: |
          # GitHub release and raw downloads intermittently fail under load; retry with backoff.
          foreach ($attempt in 1..3) {
            pob bootstrap --json
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "pob bootstrap failed after $attempt attempts" }
            Write-Host "::warning::pob bootstrap attempt $attempt failed; retrying in $($attempt * 20)s"
            Start-Sleep -Seconds ($attempt * 20)
          }
          Get-ChildItem "$env:POB_RUNTIME_DIR/engine" | Select-Object Name, Length
          if (Test-Path "$env:POB_RUNTIME_DIR/engine/pob-zh.exe") {
            throw "Slim Windows engine unexpectedly contains pob-zh.exe"
          }
          if (-not (Test-Path "$env:POB_RUNTIME_DIR/engine/PoE1/lua51.dll")) {
            throw "Slim Windows engine is missing PoE1/lua51.dll"
          }

      # The release artifact users actually run, driven against a real engine end to end.
      - name: Smoke-test standalone pob.exe against the real engine
        env:
          POB_RUNTIME_DIR: ${{ runner.temp }}/pob-win-rt
          POB_LEGACY_DIR: ""
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob") "pob.exe"
          function Invoke-Pob {
            $out = & $exe @args 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host "=== daemon.log ==="
              Get-Content -LiteralPath "$env:POB_RUNTIME_DIR/daemon.log" -ErrorAction SilentlyContinue
              throw "pob.exe $($args -join ' ') failed with exit $LASTEXITCODE. Output: $out"
            }
            return $out
          }
          $status = Invoke-Pob status --json | ConvertFrom-Json
          Write-Host "Engine: $($status | ConvertTo-Json -Depth 4 -Compress)"
          Invoke-Pob new --class Witch --asc Elementalist --level 90 --json | Out-Null
          Invoke-Pob skill new-group --label Main --gem "Fireball:20:20" --apply --json | Out-Null
          Invoke-Pob switch-main --skill-group Main --json | Out-Null
          $summary = Invoke-Pob summary --json
          Write-Host $summary
          if ($summary -notmatch '"Life"') { throw "summary has no Life stat" }
          Invoke-Pob calc "Mana" --json | Out-Null
          $code = (Invoke-Pob export-code --json | ConvertFrom-Json).code
          if (-not $code) { throw "export-code returned no code" }
          Invoke-Pob load $code --json | Out-Null
          Invoke-Pob tree set-class Witch Necromancer --apply --json | Out-Null
          Invoke-Pob matrix Original Pinnacle --json | Out-Null
          Invoke-Pob stop --json | Out-Null
          Write-Host "Frozen pob.exe real-engine smoke test passed."

      # Expected skips: 3 legacy 2.67.2 snapshot, 1 slim timeless LUT zip, the POSIX-only tests, 1 network.
      - name: Run full gate against the real engine
        env:
          POB_ROOT: ${{ runner.temp }}/pob-win-rt/engine
          POB_TEST_PERF_SLACK: "4"
        run: |
          python pob_cli/scripts/check.py --min-passed 1556 --max-skipped 33
          if ($LASTEXITCODE -ne 0) { throw "check.py full gate failed (exit $LASTEXITCODE)" }

  posix:
    name: Engine (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub labels its macOS 27 arm64 image xcode-27.
          - os: xcode-27
            label: macOS-arm64
            # Shared macOS xcode-27 runners spike up to ~5x slower than Linux under VM CPU steal.
            perf_slack: "6"
          - os: ubuntu-latest
            label: Linux-x64
            perf_slack: "4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          # No cache: this workflow gates releases, so PR/branch caches must not feed it.
          enable-cache: false

      - name: Install package and dev tools from the lockfile
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      # macOS ships LibreSSL, which cannot sign Ed25519, so the OpenSSL signing test would skip there
      # and push macOS one skip past the shared POSIX budget.
      - name: Put Homebrew OpenSSL 3 first on PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Build native POSIX LuaJIT + lua-utf8 runtime
        run: |
          chmod +x pob_cli/packaging/build_posix_runtime.sh
          ./pob_cli/packaging/build_posix_runtime.sh runtime-dist

      - name: End-to-end live PoB bootstrap & headless CLI verification
        env:
          POB_RUNTIME_DIR: ${{ runner.temp }}/pob-e2e-rt
          POB_LEGACY_DIR: ""
        run: |
          trap 'echo "=== daemon.log ==="; cat "$POB_RUNTIME_DIR/daemon.log" 2>/dev/null || true' ERR
          mkdir -p "$POB_RUNTIME_DIR/engine"
          cp -R runtime-dist/bin "$POB_RUNTIME_DIR/engine/bin"

          # Live bootstrap: fetches official PoB PoE1/ + PobTools Data/bridge/bridge.lua and passes gate_result!
          # raw.githubusercontent.com intermittently answers 503 under load; retry with backoff.
          for attempt in 1 2 3; do
            if pob bootstrap --json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pob bootstrap failed after $attempt attempts" >&2
              exit 1
            fi
            echo "::warning::pob bootstrap attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done

          # Load a minimal PoB XML build with a Fireball skill group to verify full calculation, Inflate/Deflate, mutation, and matrix
          cat > "$RUNNER_TEMP/test_build.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <PathOfBuilding>
            <Build level="90" targetVersion="3_0" className="Witch" ascendClassName="Elementalist" mainSocketGroup="1" viewMode="SKILLS"/>
            <Tree activeSpec="1"><Spec title="Default" treeVersion="3_30" classId="3" ascendClassId="2" nodes="54447"/></Tree>
            <Skills activeSkillSet="1">
              <SkillSet id="1">
                <Skill mainActiveSkill="1" enabled="true" label="Main">
                  <Gem nameSpec="Fireball" level="20" quality="20" enabled="true"/>
                </Skill>
              </SkillSet>
            </Skills>
            <Items activeItemSet="1"><ItemSet id="1"/></Items>
            <Config activeConfigSet="1"><ConfigSet id="1"/></Config>
          </PathOfBuilding>
          EOF

          # Verify persistent daemon auto-start, build load, calculation, mutation, Inflate/Deflate roundtrip, matrix, and clean shutdown
          pob status --json
          pob load "@$RUNNER_TEMP/test_build.xml" --json
          pob summary --json
          pob diagnose --no-rank -q "Hatred" --json
          pob ground "Divine Blessing" --json
          pob data tick coc --cdr 14 --json
          pob audit --json
          pob audit --keep conditionStationary --no-attribution --json
          pob skills --json
          pob items --json
          pob tree --json
          pob tree set-class Witch Necromancer --apply --json
          pob skill add --group main --gem "Added Fire Damage Support" --level 20 --quality 20 --apply --json
          pob summary --json
          CODE="$(pob export-code --json | python3 -c 'import sys, json; print(json.load(sys.stdin)["code"])')"
          test -n "$CODE"
          pob load "$CODE" --json
          pob matrix Original Pinnacle --json
          pob matrix Original Pinnacle --keep flasks --json
          pob timeless list --json
          err_rc=0
          err_out="$(pob switch-main --loadout nonexistent 2>&1)" || err_rc=$?
          if [ "$err_rc" -ne 1 ]; then
            echo "Expected exit code 1 for invalid loadout, got $err_rc: $err_out" >&2
            exit 1
          fi
          case "$err_out" in
            *Traceback*)
              echo "Unexpected Traceback in error output: $err_out" >&2
              exit 1
              ;;
          esac
          case "$err_out" in
            *"Error:"*) ;;
            *)
              echo "Expected Error: prefix, got: $err_out" >&2
              exit 1
              ;;
          esac
          pob bench list --slot gloves --limit 3 --json
          pob trade convert --text $'Rarity: RARE\nDoom Hand\nSlink Gloves\nImplicits: 0\n+42% to Fire Resistance' --to cold --json
          pob stop --json

      # Expected skips: 3 legacy 2.67.2 snapshot, 1 slim timeless LUT zip, 3 Win32-only, 1 network.
      - name: Run full gate against the real engine
        env:
          POB_ROOT: ${{ runner.temp }}/pob-e2e-rt/engine
          POB_TEST_PERF_SLACK: ${{ matrix.perf_slack }}
        run: |
          python3 pob_cli/scripts/check.py --min-passed 1581 --max-skipped 8
