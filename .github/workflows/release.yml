name: Release

# prepare -> gate (real engine) + builds (no write access) -> assemble (checksums, verify)
#   -> publish (draft, upload, verify the uploaded files, publish) -> Scoop PR, PyPI.
# Pushing a v* tag releases it; a failed release is retried with "Re-run failed jobs" on that run, which
# only refreshes the draft. Dispatching on a branch is a dry run of it: gate, build, verify and install the
# latest release, upload nothing (dispatching on a tag releases it like a push). Pull requests that touch release inputs run the dry run without the
# engine gate. Every job builds the run's own commit (github.sha), never a ref taken from an input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "pob_cli/packaging/**"
      - "pob_cli/pyproject.toml"
      - "install.ps1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv installs packages only; the interpreter is always the official CPython from setup-python.
env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  prepare:
    name: Resolve version and commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag, version and commit
        id: meta
        # Values reach the script through env, never ${{ }}, so a crafted tag cannot inject shell.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          read_version() { git show "$1:pob_cli/src/pob_cli/__init__.py" | sed -nE 's/^__version__ = "([^"]+)"$/\1/p'; }
          sha="$(git rev-parse HEAD)"
          version="$(read_version "$sha")"
          if [ "$REF_TYPE" = tag ]; then
            dry_run=false
            tag="$REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match __version__ '$version' at that commit."
              exit 1
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = false ]; then
              echo "::error::$tag is already published; releases are never replaced."
              exit 1
            fi
          else
            dry_run=true
            tag="v$version"
          fi
          if ! [[ "$version" =~ $version_re ]]; then
            echo "::error::__version__ '$version' is not X.Y.Z or X.Y.Z-pre."
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag (version $version, commit $sha, dry run: $dry_run, prerelease: $prerelease)"

  # Nothing is published unless the full gate passes against a fresh real engine on all three OSes.
  gate:
    name: Real-engine gate
    needs: prepare
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/engine.yml

  build-python:
    name: Build wheel and sdist
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          # No cache: a cache written by PR/branch runs must not feed release binaries.
          enable-cache: false

      - name: Install build tools from the lockfile
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Build wheel and sdist
        run: python -m build pob_cli --outdir dist-python

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist-python/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: false

      - name: Install package and build tools from the lockfile
        # Non-editable, so smoke checks run against the installed package data.
        run: uv sync --project pob_cli --locked --extra dev --no-editable --active

      - name: Build standalone pob.exe (PyInstaller onedir)
        run: pyinstaller --noconfirm --clean pob_cli/packaging/pob.spec

      - name: Smoke-test standalone pob.exe (including frozen _daemon spawn)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob") "pob.exe"
          $ver = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ver -notmatch [regex]::Escape($env:VERSION)) {
            throw "Unexpected pob.exe --version output: '$ver' (exit $LASTEXITCODE)"
          }
          & $exe timeless --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe timeless --help failed (missing bundled cli_timeless?)" }
          & $exe diagnose --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe diagnose --help failed" }
          & $exe ground "Divine Blessing with Hatred" --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe ground failed (missing bundled guardrails/game_data?)" }
          & $exe data tick coc --cdr 14 --aps 8.28 --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe data tick failed" }
          & $exe bench list --slot gloves --limit 3 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench list failed (missing bundled bench_costs.json?)" }
          & $exe trade convert --text "Rarity: RARE`nDoom Hand`nSlink Gloves`nImplicits: 0`n+42% to Fire Resistance" --to cold --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe trade convert failed" }
          $rt = Join-Path $env:RUNNER_TEMP "pob-release-smoke-rt"
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          $env:POB_RUNTIME_DIR = $rt
          $env:POB_LEGACY_DIR = ""
          $env:POB_OFFLINE = "1"
          $out = & $exe status 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch "bootstrap") {
            throw "Frozen daemon smoke test failed (exit $LASTEXITCODE): $out"
          }
          Write-Host "Standalone pob.exe smoke test passed ($ver)."
          exit 0

      - name: Package the zip and its aliases
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python pob_cli/packaging/release_tools.py pack-windows --dist dist/pob --out dist-windows --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "release_tools.py pack-windows failed" }

      - name: Upload Windows assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: dist-windows/*
          if-no-files-found: error

  assemble:
    name: Checksums and verification
    needs: [prepare, build-python, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Every artifact so far is a release file: the Python dists and each platform build.
        with:
          path: release-assets
          merge-multiple: true

      - name: Write and sign SHA256SUMS.txt, then verify the file set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          # Only tag runs ever see the release key; pull requests and branch dry runs get an empty value.
          SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.RELEASE_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          tools=pob_cli/packaging/release_tools.py
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          python "$tools" sums --dir release-assets
          if [ "$DRY_RUN" = true ]; then
            # Dry runs exercise signing with a throwaway key and verify against it.
            python "$tools" keygen --out "$key" > /dev/null
            verify_keys=(--public-key "$(python "$tools" pubkey --key "$key")")
          else
            if [ -z "$SIGNING_KEY" ]; then
              echo "::error::The RELEASE_SIGNING_KEY secret is not set; releases must be signed."
              exit 1
            fi
            (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
            verify_keys=()
          fi
          python "$tools" sign --dir release-assets --key "$key"
          rm -f "$key"
          python "$tools" verify --dir release-assets --version "$VERSION" "${verify_keys[@]}"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, gate, assemble]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Create or refresh the draft release
        # A rerun replaces the draft's files; a published release is never touched (prepare checks).
        run: |
          set -euo pipefail
          python pob_cli/packaging/release_tools.py notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              [ -f "release-assets/$name" ] || gh release delete-asset "$TAG" "$name" --yes
            done
          else
            pre=()
            if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
            gh release create "$TAG" --draft --verify-tag "${pre[@]}" \
              --title "pob4agents $TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber

      - name: Verify the uploaded files
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir "$RUNNER_TEMP/uploaded"
          python pob_cli/packaging/release_tools.py verify --dir "$RUNNER_TEMP/uploaded" --version "$VERSION"

      - name: Publish
        # Prereleases never become "latest", so /releases/latest/download keeps serving the stable build.
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  installer:
    name: Install with install.ps1
    # After a release: installs the new tag. Dry runs: installs the latest published release.
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.dry_run == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run install.ps1 into a temp dir
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pob-install"
          $params = @{ InstallDir = $dir; NoPath = $true }
          if ($env:DRY_RUN -eq "false") { $params.Version = $env:VERSION }
          ./install.ps1 @params
          $ver = (& (Join-Path $dir "pob.exe") --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Installed pob.exe --version failed: $ver" }
          if ($env:DRY_RUN -eq "false" -and $ver -notmatch [regex]::Escape($env:VERSION)) {
            throw "install.ps1 installed '$ver', expected $env:VERSION"
          }
          Write-Host "install.ps1 OK: $ver"

  scoop:
    name: Update the Scoop manifest
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # This job runs no third-party code; the token pushes the manifest branch.
          persist-credentials: true

      - name: Open and merge the manifest PR
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          zip="pob4agents-$VERSION-windows-x64.zip"
          sha="$(awk -v f="$zip" '$2 == f || $2 == "*" f { print $1 }' "$RUNNER_TEMP/SHA256SUMS.txt")"
          [ -n "$sha" ] || { echo "::error::$zip is missing from SHA256SUMS.txt"; exit 1; }
          python3 pob_cli/packaging/release_tools.py update-scoop --manifest bucket/pob.json --version "$VERSION" --sha256 "$sha"
          if git diff --quiet -- bucket/pob.json; then
            echo "bucket/pob.json already points at $TAG."
            exit 0
          fi
          branch="release/scoop-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add bucket/pob.json
          git commit -m "chore(scoop): update pob manifest to $TAG"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore(scoop): update pob manifest to $TAG" \
            --body "Points \`scoop update pob\` at the $TAG release. Opened by the release workflow.")"
          gh pr merge "$url" --squash --delete-branch

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, publish]
    if: vars.ENABLE_PYPI == 'true' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pob-cli
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
