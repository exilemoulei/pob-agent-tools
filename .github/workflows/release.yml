name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Defaults to current ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    # Publishes the GitHub Release and pushes the Scoop manifest bump to main.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        # Credentials stay persisted for the Scoop manifest push; .git is never uploaded as an artifact.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          # No pip cache: a cache written by PR/branch runs must not feed release binaries.

      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "./pob_cli[dev]"

      - name: Resolve and validate version against tag
        id: meta
        # Passed via env so a crafted dispatch input cannot inject PowerShell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with 'v' (got '$tag')."
          }
          $tagVersion = $tag.Substring(1)
          $pkgVersion = (python -c "import pob_cli; print(pob_cli.__version__)").Trim()
          if ($tagVersion -ne $pkgVersion) {
            throw "Tag version '$tagVersion' does not match pob_cli.__version__ '$pkgVersion'. Update pob_cli/src/pob_cli/__init__.py first."
          }
          $isPre = if ($tagVersion -match "-") { "true" } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$pkgVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Validated release tag $tag (version $pkgVersion, prerelease=$isPre)"

      - name: Run lint & architecture gate (fast + self-test)
        run: |
          python pob_cli/scripts/check.py --fast
          if ($LASTEXITCODE -ne 0) { throw "check.py --fast failed (exit $LASTEXITCODE)" }
          python pob_cli/scripts/check.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "check.py --self-test failed (exit $LASTEXITCODE)" }

      - name: Run unit tests (offline mode)
        env:
          POB_OFFLINE: "1"
        run: |
          python -m pytest pob_cli/tests -v

      - name: Build Python wheel and sdist
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          python -m build pob_cli --outdir release-assets

      - name: Build standalone Windows x64 binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean pob_cli/packaging/pob.spec

      - name: Smoke-test standalone pob.exe (including frozen _daemon spawn)
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob") "pob.exe"
          $ver = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ver -notmatch [regex]::Escape("${{ steps.meta.outputs.version }}")) {
            throw "Unexpected pob.exe --version output: '$ver' (exit $LASTEXITCODE)"
          }
          & $exe timeless --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe timeless --help failed (missing bundled cli_timeless?)" }
          & $exe diagnose --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe diagnose --help failed" }
          & $exe ground "Divine Blessing with Hatred" --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe ground failed (missing bundled guardrails/game_data?)" }
          & $exe data tick coc --cdr 14 --aps 8.28 --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe data tick failed" }
          & $exe bench list --slot gloves --limit 3 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench list failed (missing bundled bench_costs.json?)" }
          & $exe trade convert --text "Rarity: RARE`nDoom Hand`nSlink Gloves`nImplicits: 0`n+42% to Fire Resistance" --to cold --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe trade convert failed" }
          $rt = Join-Path $env:RUNNER_TEMP "pob-release-smoke-rt"
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          $env:POB_RUNTIME_DIR = $rt
          $env:POB_LEGACY_DIR = ""
          $env:POB_OFFLINE = "1"
          $out = & $exe status 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch "bootstrap") {
            throw "Frozen daemon smoke test failed (exit $LASTEXITCODE): $out"
          }
          Write-Host "Standalone pob.exe smoke test passed ($ver)."
          exit 0

      - name: Package Windows x64 zip and SHA256SUMS.txt
        id: pack
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $lines = python pob_cli/packaging/release_tools.py pack --dist dist/pob --out release-assets --tag $tag
          if ($LASTEXITCODE -ne 0) { throw "release_tools.py pack failed" }
          $zipSha = ($lines | Where-Object { $_ -match "^zip_sha256=" }) -replace "^zip_sha256=", ""
          foreach ($line in $lines) {
            $line | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          Get-ChildItem release-assets | Select-Object Name, Length | Format-Table -AutoSize
          Get-Content release-assets/SHA256SUMS.txt
          # Stable alias consumed by README /releases/latest/download links; must never silently disappear.
          if (-not (Test-Path release-assets/pob-windows-x64.zip -PathType Leaf)) {
            throw "Stable asset alias pob-windows-x64.zip is missing"
          }
          $sums = Get-Content release-assets/SHA256SUMS.txt -Encoding UTF8
          $aliasLine = $sums | Where-Object { $_ -match "\s\*?pob-windows-x64\.zip$" }
          if (-not $aliasLine) { throw "SHA256SUMS.txt is missing the stable alias entry" }
          if ($aliasLine -notmatch [regex]::Escape($zipSha)) {
            throw "Stable alias hash does not match the versioned zip hash ($zipSha)"
          }

      - name: Upload wheel/sdist artifact for optional PyPI job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: |
            release-assets/*.whl
            release-assets/*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "pob4agents ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ### Quick Install (Windows x64, No Python Required)

            **PowerShell One-Liner (Install / Update):**
            ```powershell
            irm https://raw.githubusercontent.com/exilemoulei/pob4agents/main/install.ps1 | iex
            ```

            **Scoop (Windows Package Manager):**
            ```powershell
            scoop bucket add pob https://github.com/exilemoulei/pob4agents
            scoop install pob
            # Update later:
            scoop update pob
            ```

            **Python (`uv` / `pipx` / `pip`):**
            ```powershell
            uv tool install "https://github.com/exilemoulei/pob4agents/releases/download/${{ steps.meta.outputs.tag }}/pob_cli-${{ steps.meta.outputs.version }}-py3-none-any.whl"
            ```

            After installing, run `pob bootstrap` (or `pob bootstrap --proxy http://127.0.0.1:7890`) once to fetch the headless PoB engine.

      - name: Update in-repo Scoop bucket manifest (bucket/pob.json)
        if: steps.meta.outputs.is_prerelease == 'false'
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $sha = "${{ steps.pack.outputs.zip_sha256 }}"

          git fetch origin main
          git checkout -B main origin/main

          python pob_cli/packaging/release_tools.py update-scoop --manifest bucket/pob.json --version $ver --tag $tag --sha256 $sha
          if ($LASTEXITCODE -ne 0) { throw "release_tools.py update-scoop failed" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pob.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(scoop): update pob manifest to $tag [skip ci]"
            git push origin main
          }

  publish-pypi:
    needs: build-and-release
    if: vars.ENABLE_PYPI == 'true' && needs.build-and-release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pob-cli
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
