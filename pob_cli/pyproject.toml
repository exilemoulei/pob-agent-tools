[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pob-cli"
dynamic = ["version"]
description = "Path of Building headless daemon and high-SNR CLI for agents"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
keywords = ["path-of-exile", "path-of-building", "pob", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "httpx[socks]>=0.25.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/exilemoulei/pob-agent-tools"
Repository = "https://github.com/exilemoulei/pob-agent-tools"
Issues = "https://github.com/exilemoulei/pob-agent-tools/issues"

[project.scripts]
pob = "pob_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pob_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pob_cli = ["data/*.json"]
